<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>水着美少女プロンプト100億</title>
<style>
:root{--bg:#f2f8fb;--card:#fff;--text:#1d2a33;--sub:#5f7380;--accent:#1f86b5;--line:#d6e7ef}
@media (prefers-color-scheme: dark){:root{--bg:#121b21;--card:#1b2830;--text:#e8f2f6;--sub:#9fb4bf;--accent:#5cc3ec;--line:#2c3e48}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.6}
header{padding:16px;text-align:center}
h1{margin:0;font-size:20px;color:var(--accent)}
header p{margin:4px 0 0;color:var(--sub);font-size:13px}
main{max-width:760px;margin:0 auto;padding:0 16px 40px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{font-size:12px;color:var(--sub);display:block}
select,input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:15px}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
button{flex:1;min-width:90px;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
button.sub{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button:disabled{opacity:.4}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.item h2{margin:0 0 4px;font-size:14px;color:var(--accent);display:flex;justify-content:space-between;align-items:center}
.item h2 button{flex:none;min-width:0;padding:4px 12px;font-size:12px}
.ja{font-size:13px;color:var(--sub);margin-bottom:6px}
.en{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;word-break:break-word;white-space:pre-wrap;background:var(--bg);padding:8px;border-radius:8px}
.neg{font-size:12px;color:var(--sub);word-break:break-word}
.pager{display:flex;align-items:center;gap:8px;justify-content:center;margin:12px 0}
.pager span{font-size:13px;color:var(--sub);white-space:nowrap}
.pager button{flex:none;min-width:70px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>実写・水着美少女(20歳)プロンプト 100億パターン</h1>
  <p>水着 × 色柄 × プール・水辺 × 小物 × 髪型 × 光 × 表情 × ポーズ × 構図 × カメラ(各10種)= 10,000,000,000通り。実写のみ・20歳固定。Stable Diffusion / ChatGPT / Grok 対応</p>
</header>
<main>
  <div class="panel">
    <label>出力形式</label>
    <select id="fmt">
      <option value="sd">Stable Diffusion(タグ形式+ネガティブ)</option>
      <option value="gpt">ChatGPT(自然文・指示形式)</option>
      <option value="grok">Grok(自然文・1段落)</option>
      <option value="gpt_ja">ChatGPT 日本語(自然文・指示形式)</option>
      <option value="grok_ja">Grok 日本語(自然文・1段落)</option>
    </select>
  </div>
  <div class="panel">
    <div class="grid" id="filters"></div>
    <div class="row">
      <input id="jump" type="number" min="1" max="10000000000" placeholder="番号 1〜10000000000" style="flex:1">
      <button id="btnJump" style="flex:none">表示</button>
    </div>
    <div class="row">
      <button id="btnRandom">ランダム1件</button>
      <button id="btnReset" class="sub">絞り込み解除</button>
      <button id="btnDl" class="sub">TXT保存(最大1万件)</button>
    </div>
  </div>

  <div class="panel" id="negPanel">
    <label>共通ネガティブプロンプト</label>
    <div class="neg" id="negText"></div>
    <div class="row"><button class="sub" id="btnNeg">ネガティブをコピー</button></div>
  </div>

  <div class="pager" id="pagerTop"></div>
  <div id="list"></div>
  <div class="pager" id="pagerBottom"></div>
</main>
<div id="toast"></div>

<script>
// 10軸×各10種 = 10,000,000,000パターン。番号(1〜10000000000)から一意に組み合わせを決定する
const AXES = [
  {key:"swim", name:"水着", items:[
    ["ワンピース水着","one-piece swimsuit"],
    ["ハイネック水着","high-neck one-piece swimsuit"],
    ["フリルビキニ","ruffled bikini"],
    ["スポーティーなツーピース","sporty two-piece swimsuit"],
    ["タンキニ","tankini"],
    ["オフショルダー水着","off-shoulder ruffle swimsuit"],
    ["ベルト付きレトロ水着","retro one-piece swimsuit with belt"],
    ["ラッシュガード水着","rash guard swimsuit with board shorts"],
    ["パレオ付き水着","swimsuit with a pareo wrap"],
    ["シースルーシャツ+水着","swimsuit with a sheer shirt"]
  ]},
  {key:"color", name:"色柄", items:[
    ["白","white"],
    ["黒","black"],
    ["ネイビー","navy"],
    ["パステルピンク","pastel pink"],
    ["ミントグリーン","mint green"],
    ["サックスブルー","sky blue"],
    ["レモンイエロー","lemon yellow"],
    ["花柄","floral print"],
    ["ギンガムチェック","gingham check"],
    ["ボーダー","striped"]
  ]},
  {key:"pool", name:"プール・水辺", items:[
    ["ホテルのプールサイド","luxury hotel poolside"],
    ["インフィニティプール","infinity pool overlooking the ocean"],
    ["ナイトプール","night pool with colorful LED lights"],
    ["ガラス天井の屋内プール","indoor pool with a glass ceiling"],
    ["ヤシの木のリゾートプール","tropical resort pool with palm trees"],
    ["ルーフトッププール","rooftop pool with city skyline"],
    ["ヴィラのプライベートプール","private villa pool"],
    ["白い砂浜のビーチ","white sand beach, turquoise sea"],
    ["岩場の入り江","rocky cove with clear water"],
    ["夕暮れの桟橋","wooden pier at sunset"]
  ]},
  {key:"item", name:"小物", items:[
    ["浮き輪","a swim ring"],
    ["麦わら帽子","a straw sun hat"],
    ["サングラス","sunglasses"],
    ["ビーチボール","a beach ball"],
    ["トロピカルドリンク","a tropical drink"],
    ["フラミンゴのフロート","a flamingo pool float"],
    ["ビーチタオル","a beach towel"],
    ["花の髪飾り","a flower hair clip"],
    ["レースの日傘","a lace parasol"],
    ["防水カメラ","a waterproof camera"]
  ]},
  {key:"hair", name:"髪型", items:[
    ["黒髪ロング","long straight black hair"],
    ["濡れ髪のボブ","wet-look bob haircut"],
    ["明るい茶髪ウェーブ","loose wavy light brown hair"],
    ["ハイポニーテール","high ponytail"],
    ["お団子ヘア","messy bun hairstyle"],
    ["ショートヘア","short haircut"],
    ["三つ編み","side braid"],
    ["濡れ髪のロング","long wet-look hair"],
    ["ハーフアップ","half-up hairstyle"],
    ["ミディアムの外ハネ","shoulder-length hair with flipped ends"]
  ]},
  {key:"light", name:"光", items:[
    ["自然光","bright natural sunlight"],
    ["ゴールデンアワー","golden hour backlight, warm tones"],
    ["ヤシの葉の木漏れ日","dappled sunlight through palm leaves"],
    ["シネマティック","cinematic lighting, teal and orange grading"],
    ["真夏の強い日差し","harsh summer sun, vivid colors"],
    ["曇天の柔らかい光","overcast diffused light, soft tones"],
    ["ネオンの反射光","neon rim light, colorful reflections"],
    ["水面の反射光","sunlight reflecting off water, sparkles"],
    ["逆光のリムライト","backlit rim light, glowing hair"],
    ["マジックアワー","blue hour twilight, soft ambient light"]
  ]},
  {key:"expr", name:"表情", items:[
    ["微笑み","soft smile"],
    ["自然な笑顔","natural laugh"],
    ["穏やかな表情","serene expression"],
    ["カメラ目線","looking at camera"],
    ["遠くを見る","looking at the horizon, candid"],
    ["はにかみ","shy smile"],
    ["目を閉じて風を感じる","eyes closed, enjoying the breeze"],
    ["振り返りの笑顔","smiling over her shoulder"],
    ["驚いた表情","pleasantly surprised expression"],
    ["クールな表情","cool confident expression"]
  ]},
  {key:"pose", name:"ポーズ", items:[
    ["立ちポーズ","standing pose"],
    ["プールサイドを歩く","walking along the poolside"],
    ["サンラウンジャーに座る","sitting on a sun lounger"],
    ["プールの縁に座る","sitting on the pool edge, feet in water"],
    ["腰まで水に浸かる","standing waist-deep in the water"],
    ["髪を押さえる","hand holding her hair in the wind"],
    ["水をすくう","scooping water with her hands"],
    ["手を振る","waving at the camera"],
    ["振り向く","turning around"],
    ["プールの縁にもたれる","leaning on the pool edge"]
  ]},
  {key:"comp", name:"構図", items:[
    ["バストアップ","close-up portrait"],
    ["上半身","upper body shot"],
    ["全身","full body shot"],
    ["引きの風景込み","wide shot with scenery"],
    ["ローアングル","low angle shot"],
    ["ハイアングル","high angle shot"],
    ["横顔","side profile view"],
    ["三分割構図","rule of thirds composition"],
    ["ドローン俯瞰","aerial drone shot"],
    ["背景ぼかし","shallow depth of field, bokeh background"]
  ]},
  {key:"cam", name:"カメラ", items:[
    ["フルサイズ一眼・85mm","full-frame DSLR, 85mm lens, f/1.8"],
    ["ミラーレス・50mm","mirrorless camera, 50mm lens"],
    ["中判カメラ","medium format camera, ultra fine detail"],
    ["35mmフィルム","35mm film photo, Kodak Portra 400, film grain"],
    ["富士フイルム色","Fujifilm color science, Classic Chrome"],
    ["スマホ撮影","shot on smartphone, natural casual photo"],
    ["高速シャッター","high shutter speed, frozen water splashes"],
    ["望遠200mm","telephoto 200mm lens, compressed background"],
    ["広角24mm","wide-angle 24mm lens"],
    ["ファッション誌の撮影","resort fashion magazine editorial photo"]
  ]}
];
// 「AI顔」対策:理想化する語(beautiful, 8k等)を避け、加工なしの肌・顔の左右差・個別の顔立ちを指定する
const QUALITY = "RAW photo, real candid photograph, photorealistic, unretouched, natural skin texture with visible pores, subtle facial asymmetry, natural makeup, no beauty filter, 20-year-old Japanese woman, adult, solo, swimwear fashion photography";
const NEGATIVE = "anime, cartoon, illustration, drawing, painting, 3d render, cgi, doll, doll face, plastic skin, airbrushed, smooth skin, beauty filter, perfect symmetrical face, generic face, glossy skin, overly sharp, lowres, blurry, bad anatomy, bad hands, extra fingers, deformed face, oversaturated, watermark, text, logo, worst quality, nsfw, nude, child, teenager";
// 顔立ちは番号から決まる付加要素(パターン数には数えない)。2つ選び、特定の軸と連動しないよう全桁の和を基準にする
const FACES = [
  ["丸顔","round face"],
  ["面長","slightly long oval face"],
  ["一重まぶた","monolid eyes"],
  ["奥二重","hooded double eyelids"],
  ["薄いそばかす","light freckles"],
  ["目元のほくろ","a small mole near the eye"],
  ["八重歯","a slightly crooked tooth"],
  ["太めの自然な眉","thick natural eyebrows"],
  ["えくぼ","dimples"],
  ["軽く日焼けした肌","lightly tanned skin"]
];
const D = AXES.length, TOTAL = 10 ** D, PER = 20, DL_MAX = 10000;

function digits(n){ // n: 1..TOTAL → 各軸の番号(先頭軸が最上位桁)
  let i = n-1; const idx = new Array(D);
  for(let k=D-1;k>=0;k--){ idx[k] = i%10; i = Math.floor(i/10); }
  return idx;
}
// 年齢は全形式で20歳固定。ChatGPT・Grokはネガティブプロンプト非対応のため、実写限定・AI顔対策・除外条件を本文に含める
const FORMATS = {
  sd: (e,face)=>[QUALITY, face, ...e].join(", "),
  gpt: ([swim,color,pool,item,hair,light,expr,pose,comp,cam],face)=>
    `Create a real, unretouched photograph (real photo only, not illustration, anime, or CGI): a 20-year-old Japanese woman with a natural, distinctive face (${face}) wearing a ${color} ${swim}, in a tasteful resort swimwear photoshoot.\n`+
    `Location: ${pool}. Prop: ${item}. Hairstyle: ${hair}. Lighting: ${light}. Expression: ${expr}. Pose: ${pose}. Composition: ${comp}. Camera: ${cam}.\n`+
    `Style: candid real photo, natural skin texture with visible pores and slight imperfections, subtle facial asymmetry, natural makeup, no retouching or beauty filter. Do not make an idealized, generic AI-looking face. No text, watermark, or logos.`,
  // Grokは長文・否定表現だと既定の顔に戻りやすいため、顔を先頭に置き、短く肯定形だけで書く
  grok: ([swim,color,pool,item,hair,light,expr,pose,comp,cam],face)=>
    `Candid vacation snapshot of a 20-year-old Japanese woman with ${face}, ${hair}, wearing a ${color} ${swim}, ${pose} at ${pool}, with ${item}, ${expr}. ${light[0].toUpperCase()+light.slice(1)}, ${comp}, ${cam}. Real photo, natural skin with visible pores, slightly asymmetrical face, natural makeup.`,
  gpt_ja: ([swim,color,pool,item,hair,light,expr,pose,comp,cam],face)=>
    `加工なしの実写写真を生成してください(イラスト・アニメ・CGは不可):自然で個性のある顔立ち(${face})の20歳の日本人女性が${color}の${swim}を着た、上品なリゾート水着の撮影。\n`+
    `場所:${pool}。小物:${item}。髪型:${hair}。光:${light}。表情:${expr}。ポーズ:${pose}。構図:${comp}。カメラ:${cam}。\n`+
    `スタイル:スナップ風の実写、毛穴やわずかな肌のムラが見える自然な肌、顔はわずかに左右非対称、ナチュラルメイク、レタッチや美肌フィルターなし。整いすぎたAIっぽい顔にしないでください。文字・透かし・ロゴは入れないでください。`,
  grok_ja: ([swim,color,pool,item,hair,light,expr,pose,comp,cam],face)=>
    `顔立ちは${face}の20歳の日本人女性の旅行スナップ写真。${hair}、${color}の${swim}、${pool}で${pose}、小物は${item}、${expr}。${light}、${comp}、${cam}。毛穴の見える自然な肌、少し左右非対称な顔、ナチュラルメイクの実写。`
};
let fmt = "sd";
function pickFaces(idx){
  const a = idx.reduce((s,d)=>s+d, 0) % 10;
  let b = (a + 1 + idx[D-1] % 9) % 10; // aとは必ず別の特徴
  if(a < 4 && Math.floor(a/2) === Math.floor(b/2)) b = (b + 2) % 10; // 丸顔/面長、一重/奥二重の矛盾を避ける
  return [FACES[a], FACES[b]];
}
function build(n){
  const idx = digits(n), parts = idx.map((j,k)=>AXES[k].items[j]);
  const f = pickFaces(idx), L = fmt.endsWith("_ja") ? 0 : 1;
  const face = L ? `${f[0][1]} and ${f[1][1]}` : `${f[0][0]}・${f[1][0]}`;
  return {n, en:FORMATS[fmt](parts.map(x=>x[L]), face), ja:[...parts.map(x=>x[0]), `${f[0][0]}・${f[1][0]}`].join(" / ")};
}

const $ = id=>document.getElementById(id);
const filters = {};
let page = 1, free = [], count = TOTAL;

AXES.forEach(a=>{
  const w = document.createElement("div");
  w.innerHTML = `<label>${a.name}</label><select data-k="${a.key}"><option value="">すべて</option>${a.items.map((x,j)=>`<option value="${j}">${x[0]}</option>`).join("")}</select>`;
  w.querySelector("select").addEventListener("change", e=>{filters[a.key]=e.target.value; page=1; refresh();});
  $("filters").appendChild(w);
});
$("negText").textContent = NEGATIVE;
$("fmt").addEventListener("change", e=>{ fmt=e.target.value; $("negPanel").hidden = fmt!=="sd"; render(); });

// 絞り込み結果のm番目(0始まり)→パターン番号。全件走査せず桁計算で求める
function nth(m){
  const idx = AXES.map(a=>filters[a.key] ? +filters[a.key] : 0);
  for(let f=free.length-1;f>=0;f--){ idx[free[f]] = m%10; m = Math.floor(m/10); }
  return idx.reduce((s,d)=>s*10+d, 0) + 1;
}
function refresh(){
  free = AXES.map((a,k)=>filters[a.key] ? -1 : k).filter(k=>k>=0);
  count = 10 ** free.length;
  render();
}
function render(){
  const pages = Math.ceil(count/PER);
  page = Math.min(Math.max(1,page), pages);
  const from = (page-1)*PER, to = Math.min(count, from+PER), cards = [];
  for(let m=from;m<to;m++) cards.push(card(build(nth(m))));
  $("list").innerHTML = cards.join("");
  const pg = `<button class="sub" data-p="-1" ${page<=1?"disabled":""}>前へ</button><span>${page.toLocaleString()} / ${pages.toLocaleString()}(${count.toLocaleString()}件)</span><button class="sub" data-p="1" ${page>=pages?"disabled":""}>次へ</button>`;
  $("pagerTop").innerHTML = $("pagerBottom").innerHTML = pg;
}
function card(d){
  return `<div class="item"><h2>No.${String(d.n).padStart(11,"0")}<button data-copy="${d.n}">コピー</button></h2><div class="ja">${d.ja}</div><div class="en">${d.en}</div></div>`;
}
function copy(text){
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(()=>toast("コピーしました")).catch(()=>{
    const t=document.createElement("textarea"); t.value=text; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); toast("コピーしました");
  });
}
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1200); }
function showOne(n){ $("list").innerHTML = card(build(n)); $("pagerTop").innerHTML = $("pagerBottom").innerHTML = `<button class="sub" id="back">一覧に戻る</button>`; }

document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.copy) copy(build(+b.dataset.copy).en);
  else if(b.dataset.p){ page += +b.dataset.p; render(); window.scrollTo(0,0); }
  else if(b.id==="back") render();
});
$("btnJump").onclick = ()=>{ const n=+$("jump").value; if(Number.isInteger(n)&&n>=1&&n<=TOTAL) showOne(n); else toast(`1〜${TOTAL.toLocaleString()}で入力`); };
$("btnRandom").onclick = ()=>showOne(nth(Math.floor(Math.random()*count)));
$("btnReset").onclick = ()=>{ document.querySelectorAll("#filters select").forEach(s=>s.value=""); for(const k in filters) filters[k]=""; page=1; refresh(); };
$("btnNeg").onclick = ()=>copy(NEGATIVE);
// 100億件の全件出力は数TBになるため、現在ページから最大1万件を保存する
$("btnDl").onclick = ()=>{
  const from = (page-1)*PER, to = Math.min(count, from+DL_MAX);
  let s = fmt==="sd" ? "Negative: "+NEGATIVE+"\n\n" : "";
  for(let m=from;m<to;m++){ const d=build(nth(m)); s += `No.${String(d.n).padStart(11,"0")} [${d.ja}]\n${d.en}\n\n`; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([s],{type:"text/plain"})); a.download=`swimsuit20_prompts_${fmt}_${from+1}-${to}.txt`; a.click();
  toast(`${(to-from).toLocaleString()}件を保存`);
};
refresh();
</script>
</body>
</html>
